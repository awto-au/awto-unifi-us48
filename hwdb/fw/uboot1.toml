# uboot-1 (stock U-Boot usw-v1.1.6.122-gd2310f3e), linked at 0x1c000000. Function facts only (no bytes).
# Restricted TOML subset (flat tables, one-line scalars/arrays): scripts/ghidra/hwdb_export.py rewrites this file.

[binary.uboot1]
desc = "stock U-Boot of the US-48-500W (uboot-1)"
base = 0x1c000000
arch = "armv7"

[binary.uboot1.func.relocate_code]
name = "relocate_code"
addr = 0x1c0000a0
role = "copy first 0x5814c B + 1278 R_ARM_RELATIVE fixups (@0x5595c) to 0x6ffa0000"
src = "docs/uboot.md s6"
conf = "C"

[binary.uboot1.func.iproc_config_armpll]
name = "iproc_config_armpll"
addr = 0x1c0025e4
role = "called with 400 (MHz) for BCM53342/3/4; re-programs ARM PLL every boot"
regs = ["ccu.WR_ACCESS", "ccu.POLICY_FREQ", "ccu.POLICY_CTL", "ccu.PLLARMA", "ccu.PLLARMB"]
src = "docs/uboot.md s5; docs/clocks.md"
conf = "I"

[binary.uboot1.func.wdt_arm]
name = "wdt_arm"
addr = 0x1c0027d8
role = "arm A9 private watchdog 30 s (load 0x0165A0BC, control 0xFF0B); called from board_init_r"
regs = ["twd.WDT_LOAD", "twd.WDT_CONTROL"]
src = "docs/uboot.md s2"
conf = "C"

[binary.uboot1.func.wdt_pet]
name = "wdt_pet"
addr = 0x1c002808
role = "reload private watchdog from saved value; called from getc/putc, udelay, memmove_wd, hush loop, CRC loops"
regs = ["twd.WDT_LOAD"]
src = "docs/uboot.md s2"
conf = "C"

[binary.uboot1.func.wdt_stop]
name = "wdt_stop"
addr = 0x1c00282c
role = "disable keys 0x12345678/0x87654321, control 0; called by do_bootm_linux at 0x1c00d4fc"
regs = ["twd.WDT_DISABLE", "twd.WDT_CONTROL"]
src = "docs/uboot.md s2"
conf = "C"

[binary.uboot1.func.do_wdt]
name = "do_wdt"
addr = 0x1c002868
role = "`wdt` command handler (table @0x1c0553c8)"
regs = ["twd.WDT_LOAD", "twd.WDT_CONTROL", "twd.WDT_DISABLE"]
src = "docs/uboot.md s2"
conf = "I"

[binary.uboot1.func.FUN_1c002abc]
name = "FUN_1c002abc"
addr = 0x1c002abc
role = "replay (register,value) pairs as register writes (89 pairs from 0x1c0d0000)"
src = "docs/sram.md Boot flow"
conf = "C"

[binary.uboot1.func.FUN_1c003548]
name = "FUN_1c003548"
addr = 0x1c003548
role = "DDR init (shmoo replay from mtd2)"
src = "docs/sram.md Boot flow"
conf = "C"

[binary.uboot1.func.FUN_1c00c2d4]
name = "FUN_1c00c2d4"
addr = 0x1c00c2d4
role = "DDR tune; state block ~0x2a0 B at 0x1b000000"
src = "docs/sram.md"
conf = "C"

[binary.uboot1.func.cleanup_before_linux]
name = "cleanup_before_linux"
addr = 0x1c00d0c8
