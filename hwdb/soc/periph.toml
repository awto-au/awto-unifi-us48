# iProc CCB peripherals: UART, SP805, SP804, QSPI (MSPI/BSPI), CCA GPIO, chipcommon.

[block.cca]
space = "axi0"
base = 0x18000000
size = 0x100
unit = 0
desc = "ChipcommonA: chip id, core control, GPIO"
src = "regdb/hr2_regs.tsv CHIPCOMMONA_*; docs/board.md GPIO map"
conf = "C"

[block.cca.reg.CHIPID]
offset = 0x0
reset = 0x3f00db56
access = "ro"
sdk = "CHIPCOMMONA_CHIPID"
fields = ["CHIPID 15:0 0xdb56 = 56150", "REVISIONID 19:16", "PACKAGEOPTION 23:20", "CORECOUNT 27:24", "CHIPTYPE 31:28"]
desc = "0x3f00db56 on both units"
src = "regdb; docs/a2.md (CHIPID on both units)"

[block.cca.reg.CORECTRL]
offset = 0x8
reset = 0x38
sdk = "CHIPCOMMONA_CORECTRL"
src = "regdb"

[block.cca.reg.GPIO_DIN]
offset = 0x60
access = "ro"
sdk = "CHIPCOMMONA_GPIOINPUT"
desc = "CCA bit n = Linux GPIO n+4 (stock); bit 2/3 SFP presence (active low), 6/7 system LED, 9 BCM59111 reset"
src = "docs/board.md GPIO map (0x18000060 DIN / 0x64 DOUT / 0x68 OUTEN); scripts/fan_gpio_probe.py"

[block.cca.reg.GPIO_DOUT]
offset = 0x64
sdk = "CHIPCOMMONA_GPIOOUT"
src = "docs/board.md GPIO map"

[block.cca.reg.GPIO_OUTEN]
offset = 0x68
sdk = "CHIPCOMMONA_GPIOOUTEN"
desc = "uboot-1 drives only bits 6 and 7 (setter @0x1c01f680)"
src = "docs/board.md GPIO map; docs/uboot.md s5"

[block.uart1]
space = "axi0"
base = 0x18000400
size = 0x100
unit = 0
desc = "UART1 (ns16550a, byte registers), console 115200 8N1 FIFO on; APB 50 MHz"
src = "docs/uboot.md s5 (serial_init @0x1c024a64); us48-uboot.dts serial@400"
conf = "C"

[block.uart1.reg.RBR_THR_DLL]
offset = 0x0
width = 8
sdk = "CHIPCOMMONA_UART1_RBR_THR_DLL"
src = "regdb (0x18000400); 16550 layout"

[block.uart1.reg.DLH_IER]
offset = 0x1
width = 8
sdk = "CHIPCOMMONA_UART1_DLH_IER"
src = "regdb"

[block.uart1.reg.IIR_FCR]
offset = 0x2
width = 8
sdk = "CHIPCOMMONA_UART1_IIR_FCR"
src = "regdb"

[block.uart1.reg.LCR]
offset = 0x3
width = 8
sdk = "CHIPCOMMONA_UART1_LCR"
fields = ["DLS 1:0", "STOP 2", "PEN 3", "EPS 4", "BC 6", "DLAB 7"]
src = "regdb"

[block.uart1.reg.MCR]
offset = 0x4
width = 8
sdk = "CHIPCOMMONA_UART1_MCR"
src = "regdb"

[block.uart1.reg.LSR]
offset = 0x5
width = 8
access = "ro"
reset = 0x60
sdk = "CHIPCOMMONA_UART1_LSR"
src = "regdb"

[block.uart1.reg.MSR]
offset = 0x6
width = 8
access = "ro"
sdk = "CHIPCOMMONA_UART1_MSR"
src = "regdb"

[block.uart1.reg.SCR]
offset = 0x7
width = 8
sdk = "CHIPCOMMONA_UART1_SCR"
src = "regdb"

[block.uart0]
space = "axi0"
base = 0x18000300
size = 0x100
unit = 0
like = "uart1"
desc = "UART0 (same layout as uart1); stock firmware references both"
src = "tmp/linux-mainline bcm-hr2.dtsi serial@300; scripts/stock_uart_order.py"
conf = "C"

[block.sp805]
space = "axi0"
base = 0x18039000
size = 0x1000
unit = 0
desc = "SP805 watchdog on APB 50 MHz; dev.py arms load 50e6*23 (IRQ ~23 s, reset ~46 s)"
src = "uboot-port/board/ubiquiti/us48/board.c SP805_BASE; docs/clocks.md Watchdog; scripts/dev.py:591-603"
conf = "C"

[block.sp805.reg.LOAD]
offset = 0x0
src = "docs/clocks.md E1 (mw.l 18039000 = load); ARM SP805 TRM"

[block.sp805.reg.VALUE]
offset = 0x4
access = "ro"
src = "ARM PrimeCell SP805 TRM register summary"
conf = "I"

[block.sp805.reg.CONTROL]
offset = 0x8
fields = ["INTEN 0", "RESEN 1"]
desc = "3 = IRQ + reset enable (docs/clocks.md E1)"
src = "docs/clocks.md E1 (mw.l 18039008 3)"
conf = "C"

[block.sp805.reg.INTCLR]
offset = 0xc
access = "wo"
src = "ARM PrimeCell SP805 TRM register summary"
conf = "I"

[block.sp805.reg.LOCK]
offset = 0xc00
desc = "0x1acce551 unlocks writes; any other value locks"
src = "docs/clocks.md E1 (mw.l 18039c00 1acce551)"
conf = "C"

[block.dmac]
space = "axi0"
base = 0x18020000
size = 0x1000
unit = 0
desc = "ARM PL330 DMAC (8 channels), upstream `pl330`; IRQs GIC SPI 52-59 events, 68 abort (D-Link irqs.h HX4 branch, docs/core-bringup.md; conf I)"
src = "regdb DMAC_PL330_*; tmp/linux-mainline bcm-hr2.dtsi dma@20000"
conf = "C"
note = "stays in IDM reset (dmac_idm.RESET_CONTROL = 1) until released; reading it before that stalls the bus. AXI cache/coherency attributes: CC_n.*_CACHE_CTRL"

[block.dmac.reg.DS]
offset = 0x0
access = "ro"
sdk = "DMAC_PL330_DS"
src = "regdb"

[block.dmac.reg.DPC]
offset = 0x4
access = "ro"
sdk = "DMAC_PL330_DPC"
src = "regdb"

[block.dmac.reg.INTEN]
offset = 0x20
sdk = "DMAC_PL330_INTEN"
src = "regdb"

[block.dmac.reg.CR0]
offset = 0xe00
access = "ro"
sdk = "DMAC_PL330_CR0"
desc = "build config 0: channels, peripheral requests, events (read by the driver at probe)"
src = "regdb"

[block.dmac_idm]
space = "axi0"
base = 0x18114000
size = 0x1000
unit = 0
desc = "IDM wrapper of the PL330: reset and AXI user config"
src = "regdb DMAC_M0_IDM_*"
conf = "C"

[block.dmac_idm.reg.IO_CONTROL_DIRECT]
offset = 0x408
sdk = "DMAC_M0_IDM_IO_CONTROL_DIRECT"
fields = ["CLK_GATING_EN 0 regdb name; D-Link SATA/NSP code calls bit 0 of this register the clock enable (board_bu.c config_AHCI)", "AXUSER_CONFIG_1_0 13:12 AXI user bits", "AXUSER_CONFIG_3_2 17:16 AXI user bits", "AXUSER_CONFIG_4 30 AXI user bit"]
desc = "reset value 0. Release sequence used by us48_idm_reset: leave untouched (BISDN xgs_iproc_idm_dmac_reset, D-Link SDIO); module param clk_en=1 sets bit 0 first (D-Link SATA order)"
src = "regdb DMAC_M0_IDM_IO_CONTROL_DIRECT; D-Link GPL linux-3.6.5 arch/arm/mach-iproc/board_bu.c config_AHCI/setup_sdio; bisdn xgs-iproc-idm.c"

[block.dmac_idm.reg.RESET_CONTROL]
offset = 0x800
reset = 0x1
sdk = "DMAC_M0_IDM_RESET_CONTROL"
fields = ["RESET 0"]
desc = "1 = DMAC held in reset (reset value); 0 releases it. Owner: kernel/us48-idm-reset (reset controller, pl330 `resets`). Sequence: RMW clear bit 0, read back (limit 2 us), settle 900 us"
src = "regdb; bisdn xgs-iproc-idm.c xgs_iproc_idm_dmac_reset (HR2 offset 0x14800, RMW clear bit 0, run before the DMAC is populated); D-Link board_bu.c config_AHCI (udelay(1000) after each IDM write)"
conf = "C"
note = "which stage (stock U-Boot, awto-uboot) already releases it on the board is unmeasured (#84). D-Link's own Linux never touches the DMAC wrapper (boot stage releases it)"

[block.rng]
space = "axi0"
base = 0x18033000
size = 0x14
unit = 0
desc = "ChipcommonB RNG, iProc/NSP layout (CTRL, STATUS, DATA, FF_THRES, INT_MASK): upstream `bcm2835-rng` (compatible brcm,bcm-nsp-rng). Not RNG200: iproc-rng200 expects its FIFO at +0x20"
src = "regdb CHIPCOMMONB_RNG_*; bcm2835-rng.c nsp_rng_of_data"
conf = "C"

[block.rng.reg.CTRL]
offset = 0x0
fields = ["RBGEN 0", "RBG2X 1"]
sdk = "CHIPCOMMONB_RNG_CTRL"
src = "regdb"

[block.rng.reg.STATUS]
offset = 0x4
access = "ro"
fields = ["WARM_CNT 19:0", "RND_VAL 31:24"]
sdk = "CHIPCOMMONB_RNG_STATUS"
src = "regdb"

[block.rng.reg.DATA]
offset = 0x8
access = "ro"
sdk = "CHIPCOMMONB_RNG_DATA"
src = "regdb"

