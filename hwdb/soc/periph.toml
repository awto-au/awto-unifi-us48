stride = 8
desc = "TXRAM stride 8 (docs/board.md); 16 entries"
src = "docs/board.md MSPI (TXRAM +0x40, stride 8)"

[block.mspi.reg.RXRAM]
offset = 0xc0
count = 32
stride = 4
src = "regdb MSPI_RXRAM_00 0x15c0 minus 0x1500"

[block.mspi.reg.CDRAM]
offset = 0x140
count = 16
stride = 4
fields = ["PCS 3:0", "DSCK 4", "DT 5", "BITSE 6", "CONT 7"]
src = "regdb MSPI_CDRAM_00 0x1640 minus 0x1500 (PCS 1:0 + RESERVED 3:2 there); drivers/spi/spi-bcm-qspi.c MSPI_CDRAM_PCS 0xf"

[block.mspi.reg.WRITE_LOCK]
