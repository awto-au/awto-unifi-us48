# DDR3 controller (Denali) and PHY, axi0 unit 0. Named PHY subset only; full set is regdb DDR_PHY_* (docs/ddr.md).

[block.ddr_ctl]
space = "axi0"
base = 0x18010000
size = 0x400
unit = 0
desc = "DDR3 controller, Synopsys Denali DENALI_CTL_NN at 4-byte stride"
src = "D-Link HR2 socregs.h DDR_DENALI_CTL_00 = 0x18010000; regdb DDR_DENALI_CTL_*; docs/ddr.md"
conf = "C"

[block.ddr_ctl.reg.CTL]
offset = 0x0
count = 218
stride = 4
desc = "DENALI_CTL_00..217 (regdb max CTL_217 at 0x18010364); unnamed gaps = reserved in regdb"
src = "regdb DDR_DENALI_CTL_*"
conf = "C"

[block.ddr_phy]
space = "axi0"
base = 0x18010800
size = 0x400
unit = 0
desc = "DDR PHY control regs (+0x000..0x0ff) and word lane 0 (+0x200..0x3ff)"
src = "D-Link HR2 socregs.h DDR_PHY_CONTROL_REGS_REVISION = 0x18010800; regdb DDR_PHY_*; docs/ddr.md"
conf = "C"

[block.ddr_phy.reg.REVISION]
