conf = "C"

[block.rccfg0.reg.LNKCTL2]
offset = 0xdc
desc = "link control 2 (target link speed bits 3:0); mainline drops gen2 to gen1 if NLW = 0"
src = "pcie-iproc.c:820-826 (IPROC_PCI_EXP_CAP + PCI_EXP_LNKCTL2 = 0xac + 0x30)"
conf = "I"

[block.rccfg0.reg.CLASS_CTRL]
offset = 0x43c
desc = "class code override: mainline forces 0x060400 (PCI-PCI bridge)"
