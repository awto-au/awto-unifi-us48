conf = "I"

[block.rccfg0.reg.LNKSTA]
offset = 0xbe
width = 16
access = "ro"
fields = ["CLS 3:0 current link speed (1 = 2.5 GT/s, 2 = 5 GT/s)", "NLW 9:4 negotiated link width", "TRAIN 11 link training", "SLOT_CLK 12 slot clock config", "DLLLA 13 data link layer link active"]
desc = "uboot-1 'LINKSTA reg 0xbe': port active iff (LNKSTA & 0x3f0) != 0 (NLW). Cold 0x1001 = no width = not active. Warm 0x9012 = x1, 5 GT/s, DLLLA"
