# PCIe PAXB. RC (unit 0) at 0x18012000; the endpoint's own PAXB is at BAR0+0x2000 (same layout). Offsets rel. to PAXB base.
# docs/driver-internals.md s14, docs/a2.md, docs/pci-layer.md. SDK names PAXB_0_* in regdb.
# Bring-up sequence + evidence: docs/pcie-bringup.md (#76). Mainline names: pcie-iproc.c (IPROC_PCIE_*).

[block.paxb0]
space = "axi0"
base = 0x18012000
size = 0x1000
unit = 0
desc = "Root complex PAXB of unit 0 (brcm,iproc-pcie)"
src = "bcm-hr2.dtsi pcie@18012000; regdb PAXB_0_*"
conf = "C"

[block.paxb0.reg.CLK_CONTROL]
offset = 0x0
reset = 0x4
sdk = "PAXB_0_CLK_CONTROL"
fields = ["RC_PCIE_RST_OUTPUT 0 RC PERST# output: 0 = PERST# asserted to the endpoint, 1 = released", "EP_MODE_SURVIVE_PERST 1 EP mode only; mainline clears it on assert", "EP_PERST_SOURCE_SELECT 2 EP mode PERST# source; mainline clears it on assert"]
desc = "IPROC_PCIE_CLK_CTRL. Cold 0x4 = PERST# asserted (bit 0 clear). uboot-1 only reads it. Survives DMU soft reset"
src = "regdb PAXB_0_CLK_CONTROL; pcie-iproc.c:26-33,731-755; uboot-1 0x1c0245d0-e8 (read only); stock soc_pcie_init 0xc033eae8-0xc033eb10 (= 3, 250 us, = 1, 250 ms); docs/stock-bootlog-facts.md:15-19 (cold 0x4, warm 0x1, mainline reboot 0x0)"
conf = "C"

[block.paxb0.reg.ENDIANESS]
offset = 0x30
desc = "BDE writes 0x01010101 then reads back; != 1 -> write 0 (LE)"
src = "docs/driver-internals.md 14.2 table (BAR0 0x2030)"

[block.paxb0.reg.PCIE_EP_AXI_CONFIG]
offset = 0x104
desc = "BDE writes 0 (enable iProc DMA to external host memory)"
src = "docs/driver-internals.md 14.2 (BAR0 0x2104)"

[block.paxb0.reg.TX_DEBUG_CFG]
offset = 0xf20
reset = 0x8
sdk = "PAXB_0_PAXB_TX_DEBUG_CFG"
fields = ["EP_TX_WR_CMD_BUF_DEPTH_1 0 EP TX write command buffer depth 1", "EP_TX_RD_CMD_BUF_DEPTH_1 1 EP TX read command buffer depth 1", "EP_TX_WR_RD_ORDER 2 EP TX: reads wait for earlier writes (reset 0 = a read may pass a write)", "RC_TX_WR_RD_ORDER 3 RC TX: reads wait for earlier writes (reset 1)"]
desc = "AXI -> PCIe direction: unit 1 (EP) carries a2 outbound traffic to host DDR; read-behind-write order is off at reset (#79)"
src = "regdb PAXB_0_PAXB_TX_DEBUG_CFG (regdb/hr2_regs.tsv)"
conf = "C"

[block.paxb0.reg.RX_DEBUG_CONTROL_0]
offset = 0x10c
reset = 0x1f
sdk = "PAXB_0_PCIE_PAXB_RX_DEBUG_CONTROL_0"
fields = ["RX_FREE_ARID_COUNT 1:0 inbound (PCIe -> AXI) outstanding reads, reset 3; 0 = one at a time", "RX_PAXB_FREE_CMPL_BUF_COUNT 4:2 reset 7", "RX_IGNORE_BRESP 5 reset 0"]
desc = "inbound read concurrency: a2 line fills from host DDR arrive here on unit 0 (#79)"
src = "regdb PAXB_0_PCIE_PAXB_RX_DEBUG_CONTROL_0 (regdb/hr2_regs.tsv)"
conf = "C"

[block.paxb0.reg.IMAP0_1]
offset = 0xc04
sdk = "PAXB_0_FUNC0_IMAP0_1"
desc = "unit 1: BAR0+0x2c04, ignores writes"
src = "docs/sram.md Unit 1; regdb"

[block.paxb0.reg.IMAP0_2]
offset = 0xc08
sdk = "PAXB_0_FUNC0_IMAP0_2"
fields = ["PAXB_SEL 12 set = PAXB_1 (BDE_DEV_BUS_ALT), clear = PAXB_0"]
desc = "live 0x18012001 on unit 1: b12 clear = PAXB_0, case A"
src = "docs/driver-internals.md 14.1, 14.4"

[block.paxb0.reg.IMAP0_7]
offset = 0xc1c
sdk = "PAXB_0_FUNC0_IMAP0_7"
desc = "selects the 4 KiB AXI page shown at BAR0+0x7000; host-writable; default (unit 1) 0x18032001; page address | 1"
src = "docs/a2.md; kernel/us48-pci/us48_pci.h US48_PAXB_IMAP0_7_DEF"

[block.paxb0.reg.IMAP1]
offset = 0xc80
sdk = "PAXB_0_FUNC0_IMAP1"
desc = "RC side live 0x80 (stock soc_pcie_init +0xc80 = 0x80); meaning not decoded"
src = "docs/driver-internals.md 14.3, 14.4"
conf = "I"

[block.paxb0.reg.IARR_1_LOWER]
offset = 0xd08
reset = 0x1
sdk = "PAXB_0_IARR_1_LOWER"
desc = "inbound window 1 enable, PCIe base 0 (stock soc_pcie_init writes 1); window size not decoded (>= 128 MiB)"
src = "docs/driver-internals.md 14.3; docs/pci-layer.md"

[block.paxb0.reg.OARR_0]
offset = 0xd20
sdk = "PAXB_0_OARR_0"
fields = ["VALID 0", "ADDR 31:26 outbound base, 64 MiB granule (regdb)"]
desc = "unit 1: BAR0+0x2d20; a2 host-RAM window = 0x08000001 (inside 0x08000000-0x0fffffff only)"
src = "docs/a2.md; docs/pci-layer.md us48_pci_a2_host_window"

[block.paxb0.reg.OARR_0_UPPER]
offset = 0xd24
sdk = "PAXB_0_OARR_0_UPPER"
src = "scripts/a2_bench.py (mw.l 0x08002d24 0)"

[block.paxb0.reg.OMAP_0_LO]
offset = 0xd40
fields = ["ADDR 31:26 host address the window maps to, 64 MiB aligned (regdb)"]
desc = "OMAP_0 low word; a2 host window uses 0 (AXI 0x08000000 = host phys 0)"
src = "docs/a2.md (BAR0+0x2d40/44)"

[block.paxb0.reg.OMAP_0_HI]
offset = 0xd44
src = "docs/a2.md (BAR0+0x2d40/44)"

[block.paxb0.reg.PCIE_SYS_EQ_PAGE_UPPER]
offset = 0x2c0
sdk = "PAXB_0_PCIE_SYS_EQ_PAGE_UPPER"
desc = "upper 32 bits of the event-queue page address; no function on unit 1 (EQ/MSI unused). awto-uboot uses it as the unit 1 CMIC probe marker (#98)"
src = "regdb PAXB_0_PCIE_SYS_EQ_PAGE_UPPER (regdb/hr2_regs.tsv)"

[block.paxb0.reg.OARR_FUNC0_MSI_PAGE]
offset = 0xd34
sdk = "PAXB_0_OARR_FUNC0_MSI_PAGE"
desc = "BDE: |= 1 only if MSI"
src = "docs/driver-internals.md 14.2 table"

[block.paxb0.reg.OARR_2]
offset = 0xd60
sdk = "PAXB_0_OARR_2"
desc = "endpoint DMA window to host memory; BDE writes 1, live 1 under Linux"
src = "docs/driver-internals.md 14.2, 14.4"

[block.paxb0.reg.OARR_2_UPPER]
offset = 0xd64
sdk = "PAXB_0_OARR_2_UPPER"
desc = "dma_hi_bits: 1 on PAXB_0"
src = "docs/driver-internals.md 14.2"

[block.paxb1_ep]
space = "bar0u1"
base = 0x2000
size = 0x1000
unit = 1
like = "paxb0"
desc = "Unit 1 (endpoint) PAXB through its own BAR0: BAR0 + 0x2000 + PAXB offset"
src = "docs/driver-internals.md 14.2 (BDE offsets); docs/a2.md"
conf = "C"

[block.paxb0.reg.PCIE_RC_AXI_CONFIG]
offset = 0x100
src = "regdb PAXB_0_PCIE_RC_AXI_CONFIG"
sdk = "PAXB_0_PCIE_RC_AXI_CONFIG"
desc = "RC AXI master AxUSER/AxCACHE config; not written by uboot-1 or stock"

[block.paxb0.reg.CONFIG_IND_ADDR]
offset = 0x120
sdk = "PAXB_0_CONFIG_IND_ADDR"
fields = ["ADDRESS 10:0 config-space dword offset of the RC itself (bits 1:0 = 0)", "PROTOCOL_LAYER 12:11 0 = PCIe config space", "FUNCTION_NUM 15:13 function"]
desc = "IPROC_PCIE_CFG_IND_ADDR: indirect access to the root port's own config space (bus 0, dev 0); data in CONFIG_IND_DATA"
src = "regdb PAXB_0_CONFIG_IND_ADDR; pcie-iproc.c:310 (0x120); uboot-1 FUN_1c023f88/fb4 @0x1c023f88 (writes offset & 0xffc, reads +0x124 >> (off & 3) * 8)"
conf = "C"

[block.paxb0.reg.CONFIG_IND_DATA]
offset = 0x124
sdk = "PAXB_0_CONFIG_IND_DATA"
desc = "IPROC_PCIE_CFG_IND_DATA: data of the RC config dword selected by CONFIG_IND_ADDR"
src = "regdb PAXB_0_CONFIG_IND_DATA; pcie-iproc.c:311"
conf = "C"

[block.paxb0.reg.CFG_ADDR]
offset = 0x1f8
sdk = "PAXB_0_CFG_ADDR"
fields = ["CFG_TYPE 1:0 0 = type 0, 1 = type 1", "REG_NUMBER 7:2 dword", "EXTREG_NUMBER 11:8", "FUNC_NUMBER 14:12", "DEV_NUMBER 19:15", "BUS_NUMBER 27:20"]
desc = "IPROC_PCIE_CFG_ADDR: ECAM-style address of an endpoint config access (bus >= 1); data in CFG_DATA"
src = "regdb PAXB_0_CFG_ADDR; pcie-iproc.c:469-472 (ECAM offset | CFG_TYPE_1); uboot-1 FUN_1c024258 @0x1c024258 (bus<<20 | dev<<15 | fn<<12 | reg)"
conf = "C"

[block.paxb0.reg.CFG_DATA]
offset = 0x1fc
sdk = "PAXB_0_CFG_DATA"
desc = "IPROC_PCIE_CFG_DATA: data of the endpoint config dword selected by CFG_ADDR. 0xffff0001 on a vendor-ID read = config retry (RRS)"
src = "regdb PAXB_0_CFG_DATA; pcie-iproc.c:312,481-500 (CFG_RETRY_STATUS)"
conf = "C"

[block.paxb0.reg.INTX_EN]
offset = 0x330
sdk = "PAXB_0_PCIE_SYS_RC_INTX_EN"
fields = ["EN_INTA 0 INTA", "EN_INTB 1 INTB", "EN_INTC 2 INTC", "EN_INTD 3 INTD"]
desc = "RC INTx enable; stock soc_pcie_init writes 0xf after enumeration"
src = "regdb PAXB_0_PCIE_SYS_RC_INTX_EN; stock soc_pcie_init 0xc033ebcc-d4; pcie-iproc.c:313"
conf = "C"

[block.paxb0.reg.PCIE_LINK_STATUS]
offset = 0xf0c
reset = 0x0
sdk = "PAXB_0_PCIE_LINK_STATUS"
access = "ro"
fields = ["PCIE_LINK_IN_L1 0 link in L1", "PCIE_RX_L0S_TIMEOUT 1 RX L0s timeout", "PCIE_DL_ACTIVE 2 data link layer up (DL_Active)", "PCIE_PHYLINKUP 3 PHY link up (LTSSM reached L0)"]
desc = "IPROC_PCIE_LINK_STATUS: mainline requires PHYLINKUP and DL_ACTIVE (0xc). No LTSSM state register is in the regdb or any doc; PHYLINKUP is the nearest signal"
src = "regdb PAXB_0_PCIE_LINK_STATUS; pcie-iproc.c:48-51,779-783"
conf = "C"

[block.paxb0.reg.STRAP_STATUS]
offset = 0xf10
access = "ro"
sdk = "PAXB_0_STRAP_STATUS"
desc = "PCIe straps (iproc PCIe IF enable, force 1 lane, force gen1, ...)"
src = "regdb PAXB_0_STRAP_STATUS"
conf = "C"

[block.paxb0.reg.RESET_STATUS]
offset = 0xf14
access = "ro"
sdk = "PAXB_0_RESET_STATUS"
fields = ["EP_PERST_B 1 EP PERST# input level", "HARD_RST_B 4 hard reset", "PCIE_RC_MODE_PERST_B 8 RC mode PERST# output level", "PCIE_PHY_PIPE_RESETMDIO_N 9 PHY pipe/MDIO reset (low = in reset)", "PAXB_RST_N 10 PAXB reset"]
desc = "Reset line levels; bit 8 follows CLK_CONTROL bit 0 (printed by awto-uboot)"
src = "regdb PAXB_0_RESET_STATUS (bit meaning of 8 inferred from its name)"
conf = "I"

[block.paxb0.reg.RESET_ENABLE_IN_PCIE_LINK_DOWN]
offset = 0xf18
sdk = "PAXB_0_RESET_ENABLE_IN_PCIE_LINK_DOWN"
fields = ["EN_IPROC_RESET 0 iProc reset on link down", "EN_PAXB_RESET 1 PAXB reset on link down", "EN_CHIP_RESET 2 chip reset on link down"]
desc = "Reset-on-link-down enables; reset 0, not written by uboot-1 or stock"
src = "regdb PAXB_0_RESET_ENABLE_IN_PCIE_LINK_DOWN"
conf = "C"

[block.paxb0.reg.OARR_1]
offset = 0xd28
sdk = "PAXB_0_OARR_1"
fields = ["VALID 0 window enable", "ADDR 31:26 64 MiB aligned AXI base"]
desc = "outbound window 1; stock writes (membase + 64 MiB) | 1"
src = "regdb PAXB_0_OARR_1; stock soc_pcie_init 0xc033eb84 (str [r1,#0xd28])"
conf = "C"

[block.paxb0.reg.OARR_1_UPPER]
offset = 0xd2c
sdk = "PAXB_0_OARR_1_UPPER"
desc = "outbound window 1, AXI address bits 35:32"
src = "regdb PAXB_0_OARR_1_UPPER"

[block.paxb0.reg.OMAP_1_LO]
offset = 0xd48
sdk = "PAXB_0_OMAP_1_LOWER"
desc = "outbound window 1 PCIe address low; stock writes membase + 64 MiB"
src = "regdb PAXB_0_OMAP_1_LOWER; stock soc_pcie_init 0xc033eb7c (str [r1,#0xd48])"
conf = "C"

[block.paxb0.reg.IARR_1_UPPER]
offset = 0xd0c
sdk = "PAXB_0_IARR_1_UPPER"
desc = "inbound window 1 PCIe address high"
src = "regdb PAXB_0_IARR_1_UPPER"

[block.rccfg0]
space = "rccfg0"
base = 0x0
size = 0x1000
unit = 0
desc = "Config space of unit 0's root port (bus 0 dev 0 fn 0), reached through PAXB CONFIG_IND_ADDR/DATA"
