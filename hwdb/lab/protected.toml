# Protected lab targets for scripts/board_guard.py (dev.py pre-dispatch). One place for the list.
# TODO #139: move to awto-dan docs/lab/lab.toml once that file exists (shared with st1008f), then delete this file.
# host: IP looked up by registry name (scripts/_ipreg.py); refused unless US48_BOARD_GUARD_ALLOW=<name,...> (logged).
# port: host + port named in one argument is refused always (no override).
# serial: another session's console adapter; refused always.

[[host]]
name = "st1008f-1-mgmt"
why = "sw1: awto-tl-st1008f session owns it; coordinate before touching (Dan 2026-11-16 allows lan3/lan6/lan7 bounces via the sw1_* scripts)"

[[host]]
name = "st1008f-1-relay"
why = "sw1 power relay: cutting it drops Selwyn's 10G route and the US-48 uplink"

[[host]]
name = "st1008f-2-mgmt"
why = "sw2: other session's bench switch"

[[port]]
host = "st1008f-1-mgmt"
port = "lan5"
why = "sw1 lan5 = Selwyn's 10G NIC, every route to sw1/lizard/US-48; never touched"

[[serial]]
by_id = "usb-1a86_USB2.0-Serial-if00-port0"
why = "sw2 console (CH340), owned by the awto-tl-st1008f console daemon; the US-48 is the PL2303 only"
